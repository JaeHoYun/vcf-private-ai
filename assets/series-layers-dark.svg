<rect x="132" y="460" width="804" height="56" rx="8" fill="#122a1c" stroke="#2f9e4f" stroke-width="1.5"/>
<text x="152" y="494" font-size="16" fill="#f0f6fc"><tspan font-weight="700" fill="#3fb950">⑦ 통합 설계</tspan><tspan dx="14">4계층과 ⑤⑥의 결정을 하나의 플랫폼 설계로 종합</tspan></text>
