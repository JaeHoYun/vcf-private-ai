<svg xmlns="http://www.w3.org/2000/svg" width="1022" height="410" viewBox="0 0 1022 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">게이트웨이 3계층</title>
<desc id="d">앱과 BFF의 요청은 0계층 경계(Avi VIP, WAF, TLS 종단 또는 기존 API 관리 플랫폼), 1계층 AI 게이트웨이(선택), 2계층 PAIS 서빙 게이트웨이를 거쳐 GPU 워커 노드의 Model Runtime에 도달한다. 1계층이 없으면 0계층이 2계층에 직결하고 호출 빈도 통제는 앱이 맡는다. 원격 클라우드 모델은 1계층에서 InferenceGatewayRoute를 거쳐 호출하며 NSX egress 허용이 필요하다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="20" y="100" width="140" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="90" y="162.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">앱, BFF</text>
<text x="90" y="180.82" font-size="13" text-anchor="middle" fill="#59636e">VKS 앱</text>
<text x="90" y="198.82" font-size="13" text-anchor="middle" fill="#59636e">네임스페이스</text>
<rect x="188" y="100" width="190" height="150" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<rect x="260.4" y="124.5" width="45.2" height="20" rx="10" fill="#0969da"/>
<text x="283" y="139" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">0계층</text>
<text x="283" y="166.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">경계</text>
<text x="283" y="184.82" font-size="13" text-anchor="middle" fill="#1f2328">Avi VIP, WAF,</text>
<text x="283" y="202.82" font-size="13" text-anchor="middle" fill="#1f2328">TLS 종단, 또는 기존</text>
<text x="283" y="220.82" font-size="13" text-anchor="middle" fill="#1f2328">API 관리 플랫폼</text>
<rect x="406" y="100" width="210" height="150" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="488.4" y="115.5" width="45.2" height="20" rx="10" fill="#0969da"/>
<text x="511" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1계층</text>
<text x="511" y="157.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">AI 게이트웨이 (선택)</text>
<text x="511" y="175.82" font-size="13" text-anchor="middle" fill="#1f2328">GPU 없는 VKS 네임스페이스,</text>
<text x="511" y="193.82" font-size="13" text-anchor="middle" fill="#1f2328">레플리카 2+</text>
<text x="511" y="211.82" font-size="13" text-anchor="middle" fill="#1f2328">키와 팀 예산, 별칭 라우팅,</text>
<text x="511" y="229.82" font-size="13" text-anchor="middle" fill="#1f2328">캐시, 가드레일 훅</text>
<rect x="644" y="100" width="190" height="150" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<rect x="716.4" y="133.5" width="45.2" height="20" rx="10" fill="#0969da"/>
<text x="739" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2계층</text>
<text x="739" y="175.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">PAIS 서빙 게이트웨이</text>
<text x="739" y="193.82" font-size="13" text-anchor="middle" fill="#1f2328">인증과 인가,</text>
<text x="739" y="211.82" font-size="13" text-anchor="middle" fill="#1f2328">복제본 LB, mTLS</text>
<rect x="862" y="100" width="140" height="150" rx="8" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/>
<text x="932" y="171.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">Model Runtime</text>
<text x="932" y="189.82" font-size="13" text-anchor="middle" fill="#59636e">GPU 워커 노드</text>
