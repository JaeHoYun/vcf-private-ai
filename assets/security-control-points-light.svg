<text x="371.6" y="356.04" font-size="15" font-weight="700" fill="#1f2328">앱 BFF</text>
<text x="328" y="374.82" font-size="13" fill="#1f2328">사용자 인증, 세션, 입력 가드</text>
<rect x="314" y="432" width="250" height="72" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
