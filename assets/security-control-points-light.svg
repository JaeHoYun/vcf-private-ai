<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="830" viewBox="0 0 1020 830" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">요청 경로상의 통제 지점</title>
<desc id="d">사용자 요청은 CP1 0계층 경계, CP2 1계층 AI 게이트웨이(선택), CP3 앱 BFF, CP4 오케스트레이션과 에이전트를 지난다. CP4에서 CP5 도구 게이트웨이를 거쳐 사내 시스템과 MCP 서버로, CP6 검색단 권한 필터를 거쳐 지식베이스로, CP7 2계층 PAIS 서빙 게이트웨이를 거쳐 Model Runtime으로 갈라진다. 원격 모델 호출은 CP8 반출 경계를 지나고, 응답은 CP9 출력 가드를 거쳐 CP3으로 반환된다. CP3, CP4, CP7은 CP10 트레이스와 감사로 기록을 보낸다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
