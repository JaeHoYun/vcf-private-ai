<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PAIS 서비스 아키텍처의 세 평면</title>
<desc id="d">클라이언트(고객 AI 앱)의 OpenAI 호환 요청은 제어 평면의 ML API Gateway가 인증, 인가한 뒤 추론(데이터) 평면의 Completion Endpoint, Embedding Endpoint, Agent로 라우팅한다. 엔드포인트는 모델 런타임을 호출하고, Agent는 Knowledge Base 검색과 모델 호출, 외부 도구(MCP)를 결합한다. 인입(인덱싱) 평면은 Data Source의 문서를 파싱, 청킹, 임베딩해 pgvector에 적재하고 소스 변경을 자동 갱신하며, 이 데이터가 Knowledge Base로 사용된다. 관측성은 제어와 추론 평면에서 모델 메트릭, GPU 메트릭, OTel 트레이스를 수집한다.</desc>
