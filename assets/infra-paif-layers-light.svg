<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="836" viewBox="0 0 1120 836" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PAIF 논리 계층 구조</title>
<desc id="d">위에서 아래로 고객 AI 앱, PAIS 서비스 계층, PAIF 코어 기능 계층, VCF 플랫폼의 논리 계층이다. 고객 AI 앱은 PAIF 밖에서 PAIS의 OpenAI 호환 API를 호출해 소비한다. PAIF(솔루션)는 PAIF 코어 기능 계층과 PAIS 서비스 계층으로 구성되고, PAIS는 코어와 별도로 설치하는 Supervisor 서비스 패키지다. 코어 기능 계층은 GPU enablement, 필수 공유 서비스(Harbor, DSM), 관리와 오케스트레이션(VCF Automation, VCF Operations), DLVM 이미지로 구성되고, 그 기반은 VCF 9.1의 GPU 가속 워크로드 도메인이다.</desc>
