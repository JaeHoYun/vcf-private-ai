<path d="M378,175 L406,175" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M616,175 L644,175" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M834,175 L862,175" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M283,100 L283,56 L739,56 L739,100" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="511" y="46" font-size="12" text-anchor="middle" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1계층이 없으면 직결, 호출 빈도 통제는 앱</text>
<rect x="406" y="330" width="210" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="511" y="363.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">원격 클라우드 모델</text>
<path d="M511,250 L511,330" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="521" y="284" font-size="12" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">InferenceGatewayRoute 경유,</text>
<text x="521" y="301" font-size="12" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">NSX egress 허용 필요</text>
</svg>
