<text x="152" y="382" font-size="18" font-weight="700" fill="#f0f6fc">VCF</text>
<text x="152" y="404" font-size="13" fill="#9198a1">VMware Cloud Foundation</text>
<text x="152" y="425" font-size="14" fill="#f0f6fc">컴퓨트, 스토리지, 네트워크, 쿠버네티스(VKS)</text>
<rect x="564" y="366" width="96" height="26" rx="13" fill="#11284a"/>
<text x="612.0" y="384" font-size="13" font-weight="600" text-anchor="middle" fill="#4493f8">시리즈 ①</text>
<rect x="692" y="52" width="116" height="388" rx="8" fill="#231c35" stroke="#8957e5" stroke-width="1.5"/>
