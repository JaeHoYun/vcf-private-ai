<text x="371.6" y="248.04" font-size="15" font-weight="700" fill="#1f2328">1계층 AI 게이트웨이</text>
<text x="328" y="266.82" font-size="13" fill="#1f2328">키와 팀 예산, 레이트리밋, 라우팅</text>
<rect x="314" y="324" width="250" height="72" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
