<text x="122" y="255.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">NSX Manager</text>
<rect x="40" y="296" width="164" height="60" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="122" y="320.54" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">VCF Automation,</text>
<text x="122" y="341.54" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">Operations</text>
<rect x="24" y="440" width="196" height="64" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="122" y="468.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">이그레스 프록시 (D12)</text>
<text x="122" y="486.82" font-size="13" text-anchor="middle" fill="#9198a1">→ 외부 모델 허브</text>
