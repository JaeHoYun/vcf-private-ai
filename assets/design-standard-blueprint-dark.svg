<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="714" viewBox="0 0 1000 714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">중(Standard) 블루프린트 논리 토폴로지</title>
<desc id="d">관리 도메인(vCenter, NSX Manager, VCF Automation, Operations)과 워크로드 도메인(표준 토폴로지, D1)을 분리한다. 사내 사용자와 앱의 요청은 AVI 로드밸런서(D6)를 거쳐 VKS 클러스터(D3)의 PAIS API Gateway로 들어가고, Gateway는 MIG로 분할한 GPU 노드 풀(D2)의 PAIS Model Runtime(D4)과 DSM PostgreSQL, pgvector(D8)를 호출한다. 외부 IdP(D11)가 인증을, 이그레스 프록시(D12)가 외부 모델 허브 연결을, vSAN(D7)이 가중치, 캐시, 데이터 저장을, NSX가 오버레이, VPC, 마이크로세그멘테이션 경계(D5, D10)를 맡는다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
