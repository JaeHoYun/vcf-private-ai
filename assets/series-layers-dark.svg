<text x="750.0" y="278.0" font-size="15" font-weight="600" text-anchor="middle" fill="#f0f6fc">거버넌스</text>
<rect x="820" y="52" width="116" height="388" rx="8" fill="#231c35" stroke="#8957e5" stroke-width="1.5"/>
