<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AI 애플리케이션 구조</title>
<desc id="d">사용자의 HTTP Request는 일반 웹앱과 같은 3-Tier인 Frontend(Presentation, React/Vue), Backend(BFF/Business, FastAPI), Database(Data, PostgreSQL)를 거친다. AI 앱은 여기에 AI Services(PAIS) 계층이 추가된다. Backend가 Agent API를 호출하면 Agent API가 인증과 인가를 거쳐 질문 이해, 문서 검색(Knowledge Base), 답변 생성(LLM), 출처 제공의 RAG 파이프라인을 자동 처리하고, 답변을 Backend에 스트리밍으로 반환한다.</desc>
