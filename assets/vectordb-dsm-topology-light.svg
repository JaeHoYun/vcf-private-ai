<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="676" viewBox="0 0 1160 676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">VCF 기반 pgvector 워크로드 구성</title>
<desc id="d">VCF 관리 도메인에는 vCenter Server, SDDC Manager, DSM Appliance(컨트롤 플레인), VCF Automation(셀프서비스 카탈로그), VCF Operations(DSM Management Pack)가 있다. DSM은 Infrastructure Policy로 정의한 컴퓨트, 스토리지, 네트워크에 데이터베이스를 배포한다. VCF 워크로드 도메인의 vSphere Cluster A에서는 Anti-Affinity Rule에 따라 PG Primary, PG Replica, PG Monitor가 서로 다른 ESXi 호스트에서 실행되고, RAG App VM은 Primary에서 검색하고 Replica로 읽기를 분산한다. 클러스터의 저장은 vSAN ESA가, 격리와 로드밸런싱은 NSX가 맡는다. Private AI 구성 시 DLVM, Model Runtime, 임베딩 서비스의 GPU 워크로드는 별도의 PAIF 워크로드 도메인에서 실행된다.</desc>
