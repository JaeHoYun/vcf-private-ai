<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="664" viewBox="0 0 1140 664" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AI 앱 배포 아키텍처</title>
<desc id="d">AI 플레이그라운드(PAIF/PAIS) 안의 VKS Cluster(프로젝트)에 앱을 배포한다. 외부 사용자의 HTTPS 요청은 Ingress Controller(L7 로드밸런싱, TLS 종료)를 거쳐 Frontend Pod(React, Nginx)로, 다시 Backend Pod(FastAPI, 인증 처리, AI API 중계)로 전달되고, Backend Pod가 PAIS Services(Agent API, Model Endpoints, Knowledge Base)를 호출한다. 공유 서비스로 Harbor가 컨테이너 이미지를, DSM PostgreSQL이 앱 데이터와 사용자 정보를 보관한다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="299" y="24" width="190" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
