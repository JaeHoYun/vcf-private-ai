<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PAIF 구축 Phase 개요</title>
<desc id="d">구축은 Phase 1 VCF 인프라(VCF 9.1, PAIF Workload Domain, Supervisor), Phase 2 지원 서비스(Harbor, DSM, 권장 구성인 VCF Automation), Phase 3 PAIS 3.0 설치와 활성화(UI 또는 CLI), Phase 4 개발과 운영(DLVM, VKS, 앱) 순서로 진행한다. Phase 1과 2는 VI Admin이 각각 2-3일, 1일, Phase 3은 Cloud/Org Admin이 1일, Phase 4는 DevOps와 데이터 사이언티스트가 지속적으로 담당한다.</desc>
