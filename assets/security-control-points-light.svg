<text x="328" y="614.82" font-size="13" fill="#1f2328">권한 밖 문서를 프롬프트에서 제외</text>
<rect x="594" y="564" width="250" height="72" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
