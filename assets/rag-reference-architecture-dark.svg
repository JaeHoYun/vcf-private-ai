<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="784" viewBox="0 0 1120 784" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">RAG 엔드투엔드 레퍼런스 아키텍처</title>
<desc id="d">왼쪽은 인덱싱 타임(배치), 오른쪽은 쿼리 타임(요청마다)의 4-Tier 앱 계층, 아래는 VCF 9.1.1, PAIS 3.0 플랫폼. 인덱싱은 사내 문서를 로딩, 청킹, 태깅한 뒤 임베딩 모델로 벡터화해 pgvector에 적재한다. 쿼리는 오케스트레이션이 PAIS API Gateway로 질문을 보내면 질문 임베딩, 권한 필터를 선적용한 검색, 리랭킹, 프롬프트 조립과 생성을 거쳐 출처 포함 답변을 스트리밍으로 반환한다.</desc>
