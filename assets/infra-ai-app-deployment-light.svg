<text x="404" y="92" font-size="12" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">HTTPS</text>
<rect x="24" y="108" width="740" height="500" rx="10" fill="none" stroke="#afb8c1" stroke-width="1.5"/>
<text x="38" y="130" font-size="13" font-weight="700" fill="#59636e">AI 플레이그라운드 (PAIF/PAIS)</text>
<rect x="48" y="144" width="692" height="268" rx="10" fill="none" stroke="#afb8c1" stroke-width="1.5"/>
<text x="62" y="166" font-size="13" font-weight="700" fill="#59636e">VKS Cluster (프로젝트)</text>
