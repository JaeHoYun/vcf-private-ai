<svg xmlns="http://www.w3.org/2000/svg" width="968" height="536" viewBox="0 0 968 536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">VCF Private AI 4계층 구조</title>
<desc id="d">위에서 아래로 실행(Agents, MCP), 서비스(PAIS), AI 인프라(PAIF 코어 기능 계층), 플랫폼(VCF)의 4계층. 보안과 거버넌스(⑤), 사이징, 용량, 비용(⑥)은 전 계층에 공통으로 적용되고, 통합 설계(⑦)가 이 결정을 하나의 플랫폼 설계로 종합한다.</desc>
<text x="132" y="34" font-size="13" font-weight="600" fill="#9198a1">4계층 (상위 계층은 하위 계층을 기반으로 동작)</text>
<text x="692" y="34" font-size="13" font-weight="600" fill="#9198a1">전 계층 공통</text>
<text x="116" y="101.0" font-size="14" font-weight="600" text-anchor="end" fill="#9198a1">실행</text>
<rect x="132" y="52" width="544" height="88" rx="8" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="152" y="82" font-size="18" font-weight="700" fill="#f0f6fc">Agents, MCP</text>
<text x="152" y="104" font-size="13" fill="#9198a1">실행 계층, 시리즈 본편 범위 밖</text>
<text x="152" y="125" font-size="14" fill="#f0f6fc">모델이 사내 데이터와 도구에 연결되어 업무 수행</text>
<rect x="564" y="66" width="96" height="26" rx="13" fill="#11284a"/>
<text x="612.0" y="84" font-size="13" font-weight="600" text-anchor="middle" fill="#4493f8">앱 가이드</text>
<text x="116" y="201.0" font-size="14" font-weight="600" text-anchor="end" fill="#9198a1">서비스</text>
<rect x="132" y="152" width="544" height="88" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="152" y="182" font-size="18" font-weight="700" fill="#f0f6fc">PAIS</text>
<text x="152" y="204" font-size="13" fill="#9198a1">Private AI Services</text>
<text x="152" y="225" font-size="14" fill="#f0f6fc">모델 서빙, RAG, Agent Builder, MCP (관리형)</text>
