# 가이드 저장소 Claude 문서 리뷰 워크플로
#
# 원본은 JaeHoYun/guide-tooling의 ci/doc-review.yml입니다. 각 가이드 저장소의
# .github/workflows/doc-review.yml은 이 파일의 복사본이므로 직접 고치지 말고 원본을 고친 뒤 복사합니다.
#
# PR에서 바뀐 Markdown 줄을 Claude가 리뷰 체크리스트(guide-tooling docs/review-checklist.md)로 판정하고
# 위반한 줄에 댓글을 남깁니다. 머지를 차단하지 않습니다(필수 상태 검사로 지정하지 않음).
# CLAUDE_CODE_OAUTH_TOKEN secret이 없거나 바뀐 Markdown 파일이 없으면 리뷰 단계를 생략합니다.
name: doc-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: doc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  doc-review:
    name: doc-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ${{ github.event.repository.name }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 리뷰 실행 조건 확인
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.md' | grep -v '^\.' || true)"
          if [ -z "$TOKEN" ]; then
            echo "::notice title=doc-review::CLAUDE_CODE_OAUTH_TOKEN secret이 없어 Claude 리뷰를 생략합니다"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$changed" ]; then
            echo "::notice title=doc-review::바뀐 Markdown 파일이 없어 Claude 리뷰를 생략합니다"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 체크리스트와 경고 후보 준비
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p .doc-review
          git clone --depth 1 --quiet https://github.com/JaeHoYun/guide-tooling.git .doc-review/guide-tooling
          python3 .doc-review/guide-tooling/tools/verify.py --repo . --profile "$REPO" \
            --diff-base "origin/$BASE_REF" --warn-changed-only > .doc-review/signals.txt || true

      - name: Claude 리뷰
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 저장소는 한국어 기술 가이드 문서 저장소입니다. ${{ github.repository }}의 PR #${{ github.event.pull_request.number }}에서 바뀐 문서를 리뷰합니다.

            1. 아래 파일을 읽습니다.
               - .doc-review/guide-tooling/docs/review-checklist.md: 리뷰 방법, 판정 규칙, 판정 기준
               - CLAUDE.md: 이 저장소의 문장 규칙과 작성 원칙
               - .doc-review/signals.txt: 검증 스크립트가 바뀐 줄에서 찾은 오류와 경고 후보
            2. `git diff origin/${{ github.base_ref }}...HEAD -- '*.md'`로 바뀐 줄을 확인합니다. 점(.)으로 시작하는 경로는 제외합니다.
            3. `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`로 이미 남긴 리뷰 댓글을 확인합니다. 같은 줄에 같은 규칙으로 남긴 댓글이 있으면 다시 남기지 않습니다.
            4. 체크리스트 1절의 판정 규칙과 3절의 경고 후보를 바뀐 줄에 적용합니다. 위반이 분명한 줄마다 mcp__github_inline_comment__create_inline_comment로 댓글을 남깁니다.
               - 첫 줄은 `[규칙 ID] 규칙 이름` 형식으로 작성합니다.
               - 근거를 한두 문장으로 적고, 고친 문장을 GitHub suggestion 블록으로 제안합니다.
               - 확신이 없으면 남기지 않습니다.
            5. 마지막으로 `gh pr comment ${{ github.event.pull_request.number }} --body-file -`로 요약 댓글을 하나 남깁니다. 요약에는 아래를 적습니다.
               - 규칙별 지적 건수. 지적이 없으면 없다고 적습니다.
               - 오탐으로 판정한 경고 후보 건수와 레지스트리 예외 등록 후보
               - 소유자 확인이 필요한 위치
               - 이 리뷰는 머지를 차단하지 않으며, 지적마다 수정하거나 사유를 답글로 남겨 달라는 안내
            파일을 수정하거나 커밋하지 않습니다. 모든 댓글은 한국어 존댓말로 작성하고 CLAUDE.md의 문장 규칙을 지킵니다.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh api:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
