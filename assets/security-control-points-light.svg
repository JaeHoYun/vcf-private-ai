<text x="651.6" y="596.04" font-size="15" font-weight="700" fill="#1f2328">PAIS 서빙 게이트웨이</text>
<text x="608" y="614.82" font-size="13" fill="#1f2328">2계층, 토큰 검증, 모델 라우팅</text>
