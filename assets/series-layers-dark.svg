<text x="152" y="282" font-size="18" font-weight="700" fill="#f0f6fc">PAIF 코어 기능 계층</text>
<text x="152" y="304" font-size="13" fill="#9198a1">Private AI Foundation with NVIDIA</text>
<text x="152" y="325" font-size="14" fill="#f0f6fc">GPU, 드라이버, 모델, 벡터 DB 표준화</text>
