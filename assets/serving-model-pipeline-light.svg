<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="340" viewBox="0 0 1150 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">모델 한 개의 생애주기</title>
<desc id="d">모델은 준비, 반입, 배포, 노출, 소비의 다섯 단계를 거쳐 사내 추론 API가 된다. PAIS 밖에서 준비한 외부 모델(NGC, Hugging Face) 또는 DLVM, 학습 산출물을 Model Gallery의 Harbor(OCI)에 리비전과 메타데이터와 함께 업로드한다(1). Model Runtime이 리비전으로 Endpoint를 만들어 추론 엔진 컨테이너를 VKS 워커 노드에 파드로 스케줄하고 ESXi 물리 GPU에 연결하며 복제본을 2개 이상 배치한다(2). ML API Gateway가 단일 URL로 노출하고 인증, 인가, 로드밸런싱을 처리하며(3), 앱은 base_url만 교체해 호출한다(4).</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="79" y="20" width="38" height="20" rx="10" fill="#59636e"/>
<text x="98" y="34.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">준비</text>
<text x="98" y="62" font-size="13" font-weight="600" text-anchor="middle" fill="#59636e">PAIS 밖</text>
<rect x="299" y="20" width="38" height="20" rx="10" fill="#59636e"/>
<text x="318" y="34.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">반입</text>
<text x="318" y="62" font-size="13" font-weight="600" text-anchor="middle" fill="#59636e">Model Gallery</text>
<rect x="550" y="20" width="38" height="20" rx="10" fill="#bc4c00"/>
<text x="569" y="34.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">배포</text>
<text x="569" y="62" font-size="13" font-weight="600" text-anchor="middle" fill="#59636e">Model Runtime</text>
<rect x="807" y="20" width="38" height="20" rx="10" fill="#0969da"/>
<text x="826" y="34.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">노출</text>
<text x="826" y="62" font-size="13" font-weight="600" text-anchor="middle" fill="#59636e">ML API Gateway</text>
<rect x="1033" y="20" width="38" height="20" rx="10" fill="#0969da"/>
<text x="1052" y="34.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">소비</text>
<text x="1052" y="62" font-size="13" font-weight="600" text-anchor="middle" fill="#59636e">앱, 에이전트</text>
<rect x="232" y="80" width="686" height="240" rx="10" fill="none" stroke="#afb8c1" stroke-width="1.5"/>
<text x="246" y="102" font-size="13" font-weight="700" fill="#59636e">PAIS</text>
<rect x="24" y="120" width="148" height="180" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="98" y="188.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">외부 모델</text>
<text x="98" y="206.82" font-size="13" text-anchor="middle" fill="#1f2328">NGC, Hugging Face</text>
<text x="98" y="224.82" font-size="13" text-anchor="middle" fill="#1f2328">또는 DLVM,</text>
<text x="98" y="242.82" font-size="13" text-anchor="middle" fill="#1f2328">학습 산출물</text>
<rect x="244" y="120" width="148" height="180" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="318" y="197.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">Harbor (OCI)</text>
<text x="318" y="215.82" font-size="13" text-anchor="middle" fill="#1f2328">리비전,</text>
<text x="318" y="233.82" font-size="13" text-anchor="middle" fill="#1f2328">메타데이터</text>
<rect x="464" y="120" width="210" height="180" rx="8" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/>
<text x="569" y="179.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">추론 엔진 컨테이너</text>
<text x="569" y="197.82" font-size="13" text-anchor="middle" fill="#1f2328">VKS 워커 노드에</text>
<text x="569" y="215.82" font-size="13" text-anchor="middle" fill="#1f2328">파드로 스케줄</text>
<text x="569" y="233.82" font-size="13" text-anchor="middle" fill="#1f2328">ESXi 물리 GPU에 연결</text>
<text x="569" y="251.82" font-size="13" text-anchor="middle" fill="#1f2328">복제본 2개 이상</text>
<rect x="746" y="120" width="160" height="180" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="826" y="197.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">단일 URL</text>
<text x="826" y="215.82" font-size="13" text-anchor="middle" fill="#1f2328">인증, 인가,</text>
<text x="826" y="233.82" font-size="13" text-anchor="middle" fill="#1f2328">로드밸런싱</text>
<rect x="978" y="120" width="148" height="180" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="1052" y="206.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">앱</text>
<text x="1052" y="224.82" font-size="13" text-anchor="middle" fill="#1f2328">base_url만 교체</text>
<path d="M172,210 L244,210" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="208" cy="188" r="9" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
<text x="208" y="192.5" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="208" y="232" font-size="12" text-anchor="middle" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">업로드</text>
<path d="M392,210 L464,210" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="428" cy="188" r="9" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
<text x="428" y="192.5" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="428" y="232" font-size="12" text-anchor="middle" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Endpoint</text>
<text x="428" y="249" font-size="12" text-anchor="middle" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">생성</text>
<path d="M674,210 L746,210" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="710" cy="188" r="9" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
<text x="710" y="192.5" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="710" y="232" font-size="12" text-anchor="middle" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">URL 노출</text>
<path d="M906,210 L978,210" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="942" cy="188" r="9" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
<text x="942" y="192.5" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="942" y="232" font-size="12" text-anchor="middle" fill="#59636e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">API 호출</text>
</svg>
